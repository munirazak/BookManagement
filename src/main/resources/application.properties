# Default local port. On GCP Cloud Run, Google sets PORT (usually 8080) — that overrides this.
server.port=${PORT:8081}
spring.application.name=BookManagement
# Local default. For GCP / Docker prod, set SPRING_PROFILES_ACTIVE=prod (env overrides this).
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=never
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

logging.level.root=INFO
logging.level.com.kopibru=INFO
