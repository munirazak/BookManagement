# Production profile.
#
# Cloud Run + Cloud SQL (required for GCP):
#   Set CLOUD_SQL_INSTANCE=project:region:instance
#   Attach that instance under Cloud Run "Cloud SQL connections"
#   Grant the runtime service account roles/cloudsql.client
#   Create database book_catalogue in Cloud SQL Console first
#
# Do NOT rely on localhost or a public IP host for Cloud Run.
#
# Local Docker Compose:
#   Set DB_URL=jdbc:postgresql://postgres:5432/book_catalogue (overrides default)

spring.datasource.url=${DB_URL:jdbc:postgresql:///${DB_NAME:book_catalogue}?cloudSqlInstance=${CLOUD_SQL_INSTANCE}&socketFactory=com.google.cloud.sql.postgres.SocketFactory&cloudSqlRefreshStrategy=lazy}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Skip CREATE DATABASE on Cloud SQL; still run schema.sql (CREATE TABLE IF NOT EXISTS).
app.schema-bootstrap.enabled=${SCHEMA_BOOTSTRAP_ENABLED:true}
